<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScreenBrief Privacy Policy</title>
<link rel="canonical" href="https://screenbrief.app/privacy/">
<meta http-equiv="refresh" content="0; url=https://screenbrief.app/privacy/">
<meta name="robots" content="noindex, follow">
<style>
  :root { --ink: #16151a; --ink-2: #4a4854; --paper: #fdfdfc; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #eceaf0; --ink-2: #a8a4b2; --paper: #131218; }
  }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 16px/1.65 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  main { max-width: 34rem; text-align: center; }
  h1 { font-size: 1.35rem; margin: 0 0 12px; }
  p { color: var(--ink-2); margin: 0 0 16px; }
  a { color: inherit; }
</style>
</head>
<body>
  <main>
    <h1>The ScreenBrief privacy policy has moved</h1>
    <p>It now lives on the ScreenBrief site, in English and Polish, and that copy is the one
    kept up to date.</p>
    <p><a href="https://screenbrief.app/privacy/">https://screenbrief.app/privacy/</a></p>
    <p>If your browser does not take you there automatically, follow the link above.</p>
  </main>
  <script>location.replace("https://screenbrief.app/privacy/");</script>
</body>
</html>
